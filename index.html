<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A83F5B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='8' width='18' height='14' rx='2'/><path d='M12 8v14'/><path d='M19.5 8a3.5 3.5 0 1 0-7 0'/><path d='M4.5 8a3.5 3.5 0 1 1 7 0'/></svg>" />
    <script type="text/javascript">
      try {
        var savedLogo = localStorage.getItem('rs_gifts_store_logo');
        if (savedLogo) {
          var links = document.querySelectorAll("link[rel*='icon']");
          links.forEach(function(l) { l.href = savedLogo; });
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RS Gifts - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- GitHub Pages SPA redirect receiver -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-warm-ivory text-charcoal min-h-screen antialiased selection:bg-secondary selection:text-charcoal">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
